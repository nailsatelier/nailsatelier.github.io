<!DOCTYPE html>
<html lang="es-PE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nails Atelier</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#f4f3f1">
<link rel="apple-touch-icon" href="logo.jpg">
<meta property="og:image" content="https://nailsatelier.github.io/logo.jpg">
<meta property="og:description" content="Un espacio donde la calidad, la técnica y la experiencia no se negocian. Av. San Borja Sur 247, San Borja.">
<meta property="og:title" content="Nails Atelier · Reserva tu cita">
<meta name="description" content="Reserva tu cita en Nails Atelier, salón de uñas en San Borja (Av. San Borja Sur 247). Rubber, builder gel, manicure y pedicure.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: agenda de citas en dos caras: página pública de reserva (centrada, tipo tarjeta) y panel del salón (barra superior + pestañas). */
:root{
  /* Nails Atelier (marca de TikTok @nailsatelier_pe): blanco y negro, gris microcemento y toques plata. */
  --lacquer:#161616; --lacquer-ink:#000000; --blush:#ecebe8; --lav:#e7e5e1; --mint:#efeeeb; --peach:#e3e0db; --butter:#f2f1ee;
  --ink:#161616; --muted:#6f6c68; --bg:#f4f3f1; --surface:#ffffff; --surface-2:#f0efec; --line:#e2dfda;
  --ok:#2f7d5c; --warn:#a86a1d; --bad:#b43a4f;
  --f-display:'Cormorant Garamond','Georgia',serif; --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--lacquer:#f1f1f1;--lacquer-ink:#ffffff;--blush:#2b2b2b;--lav:#2a2a2a;--mint:#262626;--peach:#303030;--butter:#2d2d2d;--ink:#f3f3f3;--muted:#b3b0ac;--bg:#141414;--surface:#1d1d1d;--surface-2:#252525;--line:#363636;--ok:#7fd1aa;--warn:#e9b56a;--bad:#ff8fa0;--on-accent:#111111;color-scheme:dark}}
:root[data-theme="dark"]{--lacquer:#f1f1f1;--lacquer-ink:#ffffff;--blush:#2b2b2b;--lav:#2a2a2a;--mint:#262626;--peach:#303030;--butter:#2d2d2d;--ink:#f3f3f3;--muted:#b3b0ac;--bg:#141414;--surface:#1d1d1d;--surface-2:#252525;--line:#363636;--ok:#7fd1aa;--warn:#e9b56a;--bad:#ff8fa0;--on-accent:#111111;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.1;text-wrap:balance}
h1{font-size:2.1rem;font-weight:600}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--lacquer)}
:focus-visible{outline:2px solid var(--lacquer);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 60px;display:flex;flex-direction:column;gap:16px}
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.top .in{max-width:1040px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:800;font-size:1.15rem;margin-right:auto}
.logo .dot{width:30px;height:30px;border-radius:50% 50% 50% 8px;background:var(--lacquer);display:grid;place-items:center;color:#fff;font-size:.9rem}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:7px 11px;border-radius:999px;font-weight:600;cursor:pointer;color:var(--muted)}
.tab[aria-current="page"]{background:var(--blush);color:var(--lacquer-ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:.92rem;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--surface-2)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--lacquer);border-color:var(--lacquer);color:var(--on-accent,#fff)}
.btn.primary:hover{background:var(--lacquer-ink);border-color:var(--lacquer-ink)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:.84rem}
.btn.ghost{border-color:transparent;background:transparent}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 auto}
.muted{color:var(--muted)}.small{font-size:.86rem}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.82rem;font-weight:600;color:var(--muted);min-width:0}
input[type=text],input[type=tel],input[type=email],input[type=password],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:.95rem;width:100%;min-width:0;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px 12px}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:.9rem;color:var(--ink);font-weight:500}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--surface-2);white-space:nowrap}
.pill.ok{color:var(--ok)}.pill.bad{color:var(--bad)}.pill.warn{color:var(--warn)}.pill.lac{color:var(--lacquer-ink);background:var(--blush)}
.tag-demo{font-size:.66rem;font-weight:800;letter-spacing:.08em;background:var(--warn);color:#fff;border-radius:4px;padding:1px 5px;vertical-align:middle}
.banner{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 14px;font-size:.9rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.warn{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));background:color-mix(in srgb,var(--warn) 10%,var(--surface))}
.banner.ok{border-color:color-mix(in srgb,var(--ok) 45%,var(--line));background:color-mix(in srgb,var(--ok) 10%,var(--surface))}
.err{color:var(--bad);font-weight:600;font-size:.9rem}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:10px 12px;flex-wrap:wrap;background:var(--surface)}
.svc{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;cursor:pointer}
.svc:hover{border-color:var(--lacquer)}
.svc .sw{width:12px;align-self:stretch;border-radius:6px;flex:none}
.svc b{font-family:var(--f-display);font-size:1.05rem}
.booker{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,.9fr);gap:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.booker>section{padding:18px;min-width:0}
.booker>section+section{border-left:1px solid var(--line)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.cal .dw{font-size:.72rem;font-weight:700;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.05em;padding:4px 0}
.day{aspect-ratio:1;border:0;border-radius:10px;background:transparent;font-weight:600;cursor:pointer;color:var(--muted);font-variant-numeric:tabular-nums}
.day.av{background:var(--blush);color:var(--lacquer-ink)}
.day.av:hover{outline:2px solid var(--lacquer)}
.day[aria-pressed="true"]{background:var(--lacquer);color:#fff}
.day:disabled{cursor:default;opacity:.45}
.slots{display:flex;flex-direction:column;gap:6px;max-height:380px;overflow:auto;margin-top:10px}
.slot{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.slot:hover{border-color:var(--lacquer);color:var(--lacquer-ink)}
.slot[aria-pressed="true"]{background:var(--lacquer);border-color:var(--lacquer);color:#fff}
.meta{display:flex;flex-direction:column;gap:6px;font-size:.92rem;margin-top:10px}
.meta span{display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface-2)}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:999px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;background:var(--surface-2);padding:8px 10px;white-space:nowrap}
td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.agenda{display:grid;gap:0;overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.ag-h{padding:8px;font-weight:700;font-size:.85rem;text-align:center;border-bottom:1px solid var(--line);background:var(--surface-2);position:sticky;top:0}
.ag-t div{height:var(--rh);font-size:.7rem;color:var(--muted);text-align:right;padding-right:6px;transform:translateY(-.5em);font-variant-numeric:tabular-nums}
.ag-c{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--rh) - 1px),var(--line) calc(var(--rh) - 1px),var(--line) var(--rh))}
.ag-off{position:absolute;left:0;right:0;background:repeating-linear-gradient(45deg,var(--surface-2),var(--surface-2) 5px,transparent 5px,transparent 10px)}
.ag-b{position:absolute;left:3px;right:3px;border-radius:8px;padding:3px 6px;font-size:.74rem;line-height:1.2;overflow:hidden;color:#3b2f37;border:0;text-align:left;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(155,79,120,.25)}
.ag-b b{display:block;font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modal-bg{position:fixed;inset:0;background:rgba(20,10,15,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px}
.modal{background:var(--surface);border-radius:16px;width:min(640px,100%);display:flex;flex-direction:column}
.modal-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-h h2{margin-right:auto}
.modal-b{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.modal-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.toast{position:fixed;right:16px;bottom:16px;z-index:80;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100vw - 32px))}
.toast div{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:.9rem}
.toast div.bad{background:var(--bad);color:#fff}
.hero{display:flex;flex-direction:column;gap:6px;text-align:center;padding:10px 0 4px}
.hero .av{width:64px;height:64px;border-radius:50% 50% 50% 14px;background:var(--lacquer);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.6rem;margin:0 auto 6px}
.done{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding:24px 16px}
.done .check{width:58px;height:58px;border-radius:50%;background:color-mix(in srgb,var(--ok) 15%,var(--surface));color:var(--ok);display:grid;place-items:center;font-size:1.8rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi span{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.kpi b{font-family:var(--f-body);font-size:1.5rem;font-variant-numeric:tabular-nums}
@media (max-width:860px){.booker{grid-template-columns:minmax(0,1fr)}.booker>section+section{border-left:0;border-top:1px solid var(--line)}.slots{max-height:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr))}}

/* Marca Nails Atelier */
.na-logo{display:flex;align-items:center;gap:10px;min-width:0}
.na-logo img{width:38px;height:38px;border-radius:50%;flex:none;object-fit:cover;border:1px solid var(--line)}
.na-word{display:flex;flex-direction:column;line-height:1;min-width:0}
.na-word b{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:1.32rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);white-space:nowrap}
.na-word b i{font-style:normal}
.na-word small{font-size:.62rem;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:3px}
.na-hero{position:relative;overflow:hidden;border-radius:22px;padding:26px 22px;display:flex;flex-direction:column;gap:8px;color:#161616;border:1px solid var(--line);background:radial-gradient(120% 80% at 15% 20%,rgba(255,255,255,.75),transparent 60%),radial-gradient(90% 70% at 85% 90%,rgba(150,148,144,.28),transparent 65%),radial-gradient(60% 50% at 70% 25%,rgba(120,118,114,.16),transparent 70%),linear-gradient(160deg,#e9e8e5,#d9d7d3 55%,#e6e4e0)}
.na-hero>*{position:relative}
.na-hero .na-tag{font-size:.68rem;letter-spacing:.26em;text-transform:uppercase;color:#3d3b38;font-weight:700}
.na-hero h1 i{font-weight:500}
.na-hero .na-info{font-size:.86rem;color:#3d3b38;display:flex;flex-direction:column;gap:2px;margin-top:4px}
.na-hero h1{font-size:2.3rem}
.na-hero p{margin:0;color:#2a2826}
.na-foot{max-width:520px;margin:6px auto 0;padding:18px 4px 6px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;font-size:.86rem;color:var(--muted);text-align:center}
.na-foot b{font-family:var(--f-display);font-size:1.05rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);font-weight:600}
.na-foot a{color:var(--ink);font-weight:600}
.na-sec{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:8px}
.na-sec h2{font-family:var(--f-display);font-size:1.45rem;font-weight:600;letter-spacing:.02em}
.na-sec ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}.na-sec p{margin:0}
.na-sec .na-k{font-size:.68rem;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);font-weight:700}
.na-menu{display:flex;flex-direction:column}.na-menu div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}.na-menu div:last-child{border-bottom:0}
.na-menu b{font-weight:700}.na-menu small{display:block;color:var(--muted);font-size:.82rem;margin-top:2px}.na-menu span:last-child{white-space:nowrap;font-weight:700}
.na-about{background:#161616;color:#f4f3f1;border-color:#161616}.na-about h2{color:#fff}.na-about .na-k{color:#bdbab5}
.w-link{background:none;border:0;padding:0;color:var(--ink);font-weight:700;text-decoration:underline;cursor:pointer;font-size:inherit}
.na-social{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px 0 2px}
.na-social a{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--ink);background:var(--surface);color:var(--ink);text-decoration:none;font-weight:700;font-size:.9rem}
.na-social a:hover{background:var(--ink);color:var(--bg)}.na-social svg{width:18px;height:18px;flex:none}
.na-follow{font-family:var(--f-display);font-style:italic;font-size:1.15rem;color:var(--ink)}
/* Página de la clienta: pensada para celular, un paso por pantalla y botón fijo abajo. */
.ptop{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.pin{max-width:520px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.pav{width:34px;height:34px;border-radius:50% 50% 50% 9px;background:var(--lacquer);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;flex:none}
.pname{font-family:var(--f-display);font-size:1.05rem;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plink{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:700;font-size:.85rem;cursor:pointer;color:var(--ink)}
.mwrap{max-width:520px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-bottom:96px}
.w-head{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:10px}
.w-back{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.5rem;line-height:1;cursor:pointer;color:var(--ink)}
.w-prog{display:flex;gap:5px}.w-prog i{flex:1;height:5px;border-radius:9px;background:var(--line)}.w-prog i.on{background:var(--lacquer)}
.w-n{font-size:.8rem;color:var(--muted);font-weight:700;text-align:right}
.w-title{font-size:2rem;font-weight:600;letter-spacing:0;line-height:1.05}
.w-sub{color:var(--muted);margin:-6px 0 0}
.w-chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.w-chips::-webkit-scrollbar{display:none}
.w-chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 15px;font-weight:700;cursor:pointer;color:var(--ink)}
.w-chip[aria-pressed="true"]{background:var(--blush);border-color:var(--lacquer);color:var(--lacquer-ink)}
.w-list{display:flex;flex-direction:column;gap:10px}
.w-opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:20px;box-shadow:0 2px 10px rgba(155,79,120,.06);padding:14px;min-height:72px;cursor:pointer;color:var(--ink)}
.w-opt:active{transform:scale(.99)}.w-opt:hover{border-color:var(--lacquer)}
.w-sw{width:44px;height:44px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 3px rgba(255,255,255,.6)}
.w-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.w-txt b{font-size:1.05rem}.w-txt small{color:var(--muted);font-size:.86rem}
.w-meta{font-weight:700}
.w-price{font-family:var(--f-body);font-weight:700;font-size:1rem;white-space:nowrap;color:var(--lacquer-ink)}
.w-ava{width:46px;height:46px;border-radius:50%;background:var(--blush);color:var(--lacquer-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.2rem;flex:none}.w-ava.any{background:var(--lav);color:var(--lacquer-ink)}
.w-go{font-size:1.6rem;color:var(--muted)}
.w-days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scroll-snap-type:x proximity;scrollbar-width:none}.w-days::-webkit-scrollbar{display:none}
.w-day{flex:none;width:64px;padding:8px 0;border:1px solid var(--line);background:var(--surface);border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;scroll-snap-align:start;color:var(--ink)}
.w-day b{font-family:var(--f-body)!important;font-weight:700}.w-day small{font-size:.72rem;color:var(--muted);text-transform:capitalize;font-weight:600}.w-day b{font-family:var(--f-display);font-size:1.35rem}
.w-day[aria-pressed="true"]{background:var(--lacquer);border-color:var(--lacquer);color:var(--on-accent,#fff)}.w-day[aria-pressed="true"] small{color:inherit;opacity:.75}
.w-day:disabled{opacity:.35;cursor:default}.w-day.more{font-size:.78rem;font-weight:700;color:var(--lacquer-ink);justify-content:center}
.w-date{font-weight:700;text-transform:capitalize;margin:0}
.w-gl{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:4px 0 -4px}
.w-times{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.w-time{min-height:50px;border:1px solid var(--line);background:var(--surface);border-radius:12px;font-weight:800;font-size:1.02rem;cursor:pointer;font-variant-numeric:tabular-nums;color:var(--ink)}
.w-time[aria-pressed="true"]{background:var(--lacquer);border-color:var(--lacquer);color:var(--on-accent,#fff)}
.w-bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.w-cta{display:block;width:100%;max-width:488px;margin:0 auto;min-height:54px;border:0;border-radius:999px;background:var(--lacquer);color:var(--on-accent,#fff);letter-spacing:.02em;font-weight:800;font-size:1.08rem;cursor:pointer}
.w-cta[disabled]{background:var(--line);color:var(--muted);cursor:default}
.w-sum{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;background:linear-gradient(135deg,var(--blush),var(--lav));border-radius:16px;padding:14px 16px}
.w-sum div{display:flex;flex-direction:column;gap:3px;min-width:0}.w-sum span{font-size:.9rem;color:var(--ink);text-transform:none}
.w-form{display:flex;flex-direction:column;gap:12px}
.w-f{display:flex;flex-direction:column;gap:5px;font-weight:700;font-size:.9rem}
.w-f input,.w-f textarea{font-size:16px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.w-more summary{cursor:pointer;color:var(--lacquer-ink);font-weight:700;padding:4px 0}.w-more[open]{display:flex;flex-direction:column;gap:10px}
.w-pol{font-size:.84rem;color:var(--muted);margin:0}
.w-empty{text-align:center;padding:30px 10px;display:flex;flex-direction:column;gap:12px}
.w-done{display:flex;flex-direction:column;gap:14px;align-items:stretch;text-align:center}
.w-done .check{width:68px;height:68px;border-radius:50%;background:color-mix(in srgb,var(--ok) 15%,var(--surface));color:var(--ok);display:grid;place-items:center;font-size:2rem;margin:8px auto 0}
.w-done .w-sum{text-align:left}
.w-code{font-family:ui-monospace,Consolas,monospace;font-size:1.6rem;font-weight:800;letter-spacing:.12em;background:var(--surface);border:2px dashed var(--lacquer);border-radius:14px;padding:12px}
.w-acts{display:flex;flex-direction:column;gap:10px}
#mine input{font-size:16px;padding:12px 13px}#mine .btn{min-height:46px}#m-out .btn{min-height:46px;flex:1}
.w-btn{display:flex;align-items:center;justify-content:center;min-height:50px;border:1px solid var(--line);background:var(--surface);border-radius:14px;font-weight:700;text-decoration:none;color:var(--ink);cursor:pointer;font-size:1rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<div id="app"><div class="wrap"><p class="muted">Cargando agenda…</p></div></div>
<script>
(function () {
  'use strict';
  // ───────── utilidades (hora de Lima, UTC−5 sin horario de verano) ─────────
  const pad = (n) => String(n).padStart(2, '0');
  const hm = (m) => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
  const pHM = (s) => { const [h, m] = String(s || '0:0').split(':').map(Number); return h * 60 + (m || 0); };
  const addDays = (d, n) => { const x = new Date(d + 'T12:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
  const dow = (d) => new Date(d + 'T12:00:00Z').getUTCDay();
  const epoch = (d, m) => { const [y, mo, da] = d.split('-').map(Number); return Date.UTC(y, mo - 1, da) + (m + 300) * 60000; };
  const nowL = () => { const t = Date.now() - 5 * 3600000; const x = new Date(t); return { date: x.toISOString().slice(0, 10), min: x.getUTCHours() * 60 + x.getUTCMinutes(), ts: Date.now() }; };
  const fmtD = (d, o) => new Intl.DateTimeFormat('es-PE', Object.assign({ timeZone: 'UTC', weekday: 'long', day: 'numeric', month: 'long' }, o || {})).format(new Date(d + 'T12:00:00Z'));
  const money = (n) => 'S/ ' + (Math.round((Number(n) || 0) * 100) / 100).toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const code = () => 'C-' + Math.random().toString(36).slice(2, 8).toUpperCase();
  const normPhone = (s) => { let d = String(s || '').replace(/\D/g, ''); if (d.length === 11 && d.startsWith('51')) d = d.slice(2); return d; };
  const $ = (s, el) => (el || document).querySelector(s);
  const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
  const DOWS = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];

  // ───────── datos ─────────
  const COLLS = ['config', 'services', 'staff', 'timeoff', 'bookings', 'clients'];
  const S = {}; COLLS.forEach((c) => (S[c] = {}));
  const DEF = { id: 'main', name: 'Nails Atelier', tagline: 'Un espacio donde la calidad, la técnica y la experiencia no se negocian.', hours: 'Lunes a sábado', address: 'Av. San Borja Sur 247, San Borja, Lima', phone: '915049042', tiktok: 'nailsatelier_pe', instagram: 'nailsatelier_pe', slotStep: 15, minNotice: 120, maxDays: 30, depositPct: 0, payMethods: 'Yape · Visa por pago link (+5%)', policy: 'Puedes reprogramar sin penalidad hasta un día antes de tu cita, como máximo a las 8:00 p. m. Después de ese plazo, la cancelación o reprogramación tiene una penalidad de S/ 20 que se descuenta del adelanto.',
    cutoffPrevDayMin: 1200,
    about: 'Somos NAILS ATELIER, un estudio de belleza para uñas que combina técnica y estética, con el propósito de elevar el estándar de servicio: desde la atención hasta la calidad de productos.',
    landmark: 'Al costado de La Romana Pizzería',
    parking: ['El edificio cuenta con 3 estacionamientos afuera de Tambo, sujetos a disponibilidad.', 'En el parque frente al edificio hay parqueos públicos sin costo, también sujetos a disponibilidad.', 'Si prefieres una playa de estacionamiento, hay una a la espalda del edificio, en la calle López de Ayala.'],
    payInfo: ['Aceptamos pagos con Yape.', 'Pagos con tarjeta Visa a través de pago link: te lo enviamos por WhatsApp y puedes pagar mientras te realizan el servicio (+5% de recargo).'],
    policies: ['Las reservas pueden reprogramarse sin penalidad hasta un día antes de la cita, como máximo a las 8:00 p. m.', 'Las cancelaciones o reprogramaciones después de ese plazo, incluido el mismo día de la cita, tienen una penalidad de S/ 20 que se descuenta del adelanto (aun si la reserva se hizo el mismo día).', 'Contamos con una tolerancia máxima de 10 minutos. Recomendamos llegar puntual, incluso si avisaste de la tardanza, porque puede afectar la siguiente atención.', 'Pasados los 10 minutos, el servicio podrá ajustarse según el tiempo disponible: puede ser un servicio más sencillo o sin algunos detalles del diseño.', 'Si la tardanza supera los 25 minutos, será necesario reprogramar la cita. En ese caso el adelanto no es reembolsable y se aplica la penalidad correspondiente.', 'No realizamos servicios sobre uñas con signos de posibles hongos o infecciones bacterianas. En esos casos recomendamos acudir a un profesional de salud antes de programar una nueva cita.'],
    extras: ['Tip por uña rota | S/ 5 c/u', 'Efectos y diseños | desde S/ 10', 'Retiro de sistema acrílico, softgel u otro por filtración | S/ 20'] };
  const cfg = () => Object.assign({}, DEF, S.config.main || {});
  const arr = (x) => (Array.isArray(x) ? x : String(x || '').split('\n')).map((t) => String(t).trim()).filter(Boolean);
  // Hasta cuándo la clienta puede cambiar o cancelar sola: el día anterior a la hora fijada (p. ej. 20:00) o, si no hay, 3 horas antes.
  const changeDeadline = (b) => { const c = cfg(); return c.cutoffPrevDayMin != null && c.cutoffPrevDayMin !== '' ? epoch(addDays(b.date, -1), Number(c.cutoffPrevDayMin)) : epoch(b.date, b.start) - 3 * 3600000; };
  const deadlineText = () => { const c = cfg(); if (c.cutoffPrevDayMin == null || c.cutoffPrevDayMin === '') return '3 horas antes de la cita'; const m = Number(c.cutoffPrevDayMin); const h = Math.floor(m / 60); return 'un día antes, hasta las ' + ((h % 12) || 12) + ':' + pad(m % 60) + (h < 12 ? ' a. m.' : ' p. m.'); };
  let backend = 'local'; let canEdit = false; let listeners = []; let sb = null; let session = null;
  const CONF = window.NAILS_CONFIG || {};
  const LS = 'nails-atelier.prueba.v1';
  const notify = () => { clearTimeout(notify.t); notify.t = setTimeout(() => listeners.forEach((f) => f()), 30); };
  function saveLocal() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) { /* sin almacenamiento */ } }
  // Columnas de Supabase ↔ objetos de la interfaz
  const MAP = {
    config: { to: (c) => ({ id: 'main', data: c }), from: (r) => Object.assign({}, r.data || {}, { id: 'main' }) },
    services: { to: (s) => ({ id: s.id, name: s.name, category: s.category || null, duration: Number(s.duration), price: Number(s.price) || 0, buffer_before: Number(s.bufferBefore) || 0, buffer_after: Number(s.bufferAfter) || 0, color: s.color || null, description: s.description || null, active: s.active !== false, sort: Number(s.order) || 0, demo: !!s.demo }),
      from: (r) => ({ id: r.id, name: r.name, category: r.category || '', duration: r.duration, price: Number(r.price), bufferBefore: r.buffer_before, bufferAfter: r.buffer_after, color: r.color, description: r.description || '', active: r.active, order: r.sort, demo: r.demo }) },
    staff: { to: (p) => ({ id: p.id, name: p.name, services: p.services || [], schedule: p.schedule || {}, active: p.active !== false, demo: !!p.demo }), from: (r) => ({ id: r.id, name: r.name, services: r.services || [], schedule: r.schedule || {}, active: r.active, demo: r.demo }) },
    timeoff: { to: (o) => ({ id: o.id, staff_id: o.staffId, date: o.date, start_min: o.start, end_min: o.end, reason: o.reason || null }), from: (r) => ({ id: r.id, staffId: r.staff_id, date: r.date, start: r.start_min, end: r.end_min, reason: r.reason || '' }) },
    bookings: { to: (b) => ({ id: b.id, code: b.code, service_id: b.serviceId, service_name: b.serviceName, staff_id: b.staffId, staff_name: b.staffName, date: b.date, start_min: b.start, end_min: b.end, block_start: b.blockStart, block_end: b.blockEnd, price: b.price, client_name: b.client.name, client_phone: b.client.phone, client_email: b.client.email || null, client_note: b.client.note || null, client_dni: b.client.dni || null, status: b.status, source: b.source, cancel_reason: b.cancelReason || null, history: b.history || [], demo: !!b.demo }),
      from: (r) => ({ id: r.id, code: r.code, serviceId: r.service_id, serviceName: r.service_name, staffId: r.staff_id, staffName: r.staff_name, date: r.date, start: r.start_min, end: r.end_min, blockStart: r.block_start, blockEnd: r.block_end, price: Number(r.price), client: { name: r.client_name, phone: r.client_phone, email: r.client_email || '', note: r.client_note || '', dni: r.client_dni || '' }, status: r.status, source: r.source, cancelReason: r.cancel_reason || '', history: r.history || [], demo: r.demo, createdAt: r.created_at }) },
  };
  MAP.clients = { to: (c) => ({ dni: c.id, name: c.name, phone: c.phone || null, email: c.email || null, notes: c.notes || null }),
    from: (r) => ({ id: r.dni, name: r.name, phone: r.phone || '', email: r.email || '', notes: r.notes || '', firstSeen: r.first_seen, lastSeen: r.last_seen }) };
  const TABLE = { config: 'settings', services: 'services', staff: 'staff', timeoff: 'timeoff', bookings: 'bookings', clients: 'clients' };
  // Los mensajes de las funciones de la base (raise exception) llegan tal cual para mostrarlos a la clienta.
  const sbErr = (e) => new Error((e && (e.message || e.details)) || 'No se pudo conectar. Revisa tu internet e intenta de nuevo.');
  async function put(c, rec) {
    rec = JSON.parse(JSON.stringify(rec)); S[c][rec.id] = rec; notify();
    if (backend === 'supabase') { const { error } = await sb.from(TABLE[c]).upsert(MAP[c].to(rec)); if (error) { await loadAll().catch(() => {}); throw sbErr(error); } }
    else saveLocal();
    return rec;
  }
  async function del(c, id) {
    delete S[c][id]; notify();
    if (backend === 'supabase') { const { error } = await sb.from(TABLE[c]).delete().eq(c === 'clients' ? 'dni' : 'id', id); if (error) { await loadAll().catch(() => {}); throw sbErr(error); } }
    else saveLocal();
  }
  const vals = (o) => Object.values(o || {});
  async function rpc(fn, args) { const { data, error } = await sb.rpc(fn, args); if (error) throw sbErr(error); return data; }
  async function loadAll() {
    if (backend !== 'supabase') return;
    const get = async (c) => { const { data, error } = await sb.from(TABLE[c]).select('*'); if (error) throw sbErr(error); const m = {}; (data || []).forEach((r) => { const o = MAP[c].from(r); m[o.id] = o; }); S[c] = m; };
    await Promise.all(['config', 'services', 'staff'].map(get));
    if (canEdit) await Promise.all(['timeoff', 'bookings', 'clients'].map(get));
    else {
      // Público: solo bloques ocupados, sin nombres ni celulares.
      const n = nowL(); const rows = await rpc('busy_blocks', { p_from: n.date, p_to: addDays(n.date, Number(cfg().maxDays) + 1) });
      const m = {}; (rows || []).forEach((r, i) => (m['x' + i] = { id: 'x' + i, staffId: r.staff_id, date: r.date, blockStart: r.block_start, blockEnd: r.block_end, status: 'confirmada', client: {} }));
      S.bookings = m; S.timeoff = {};
    }
    notify();
  }
  async function checkAdmin() {
    if (!session) return false;
    const { data, error } = await sb.from('admins').select('user_id').eq('user_id', session.user.id).maybeSingle();
    return !error && !!data;
  }
  async function init() {
    if (CONF.supabaseUrl && CONF.supabaseAnonKey && window.supabase) {
      sb = window.supabase.createClient(CONF.supabaseUrl, CONF.supabaseAnonKey, { auth: { persistSession: true, storageKey: 'nails-atelier-sesion' } });
      backend = 'supabase';
      try { session = (await sb.auth.getSession()).data.session; canEdit = await checkAdmin(); } catch (e) { session = null; canEdit = false; }
      try { await loadAll(); } catch (e) { UI.loadError = e.message; }
      setInterval(() => { if (!document.hidden && !modalEl) loadAll().catch(() => {}); }, canEdit ? 20000 : 60000);
    } else {
      // Sin config.js: modo de prueba en este navegador, para revisar el diseño antes de conectar Supabase.
      backend = 'local'; canEdit = true;
      try { const o = JSON.parse(localStorage.getItem(LS) || '{}'); COLLS.forEach((c) => (S[c] = o[c] || {})); } catch (e) { /* vacío */ }
    }
  }
  async function login(email, password) {
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw new Error(/invalid/i.test(error.message) ? 'Correo o contraseña incorrectos.' : error.message);
    session = data.session; canEdit = await checkAdmin();
    if (!canEdit) { await sb.auth.signOut(); session = null; throw new Error('Esta cuenta no tiene acceso al panel del salón.'); }
    await loadAll();
  }
  async function logout() { if (sb) await sb.auth.signOut(); session = null; canEdit = false; await loadAll().catch(() => {}); }
  async function withLock(name, fn) { return fn(); } // en Supabase la base impide los cruces (restricción sin_cruces)

  // ───────── disponibilidad (mismo modelo que Cal.com: tipo de cita + horario + reservas + ausencias) ─────────
  const services = (all) => vals(S.services).filter((s) => all || s.active !== false).sort((a, b) => (a.order || 0) - (b.order || 0) || a.name.localeCompare(b.name));
  const staffFor = (svcId) => vals(S.staff).filter((p) => p.active !== false && (p.services || []).includes(svcId));
  const busyOf = (staffId, date, exceptId) => vals(S.bookings).filter((b) => b.staffId === staffId && b.date === date && b.status !== 'cancelada' && b.id !== exceptId).map((b) => [b.blockStart, b.blockEnd])
    .concat(vals(S.timeoff).filter((o) => o.staffId === staffId && o.date === date).map((o) => [o.start, o.end]));
  function slotsFor(svc, staffId, date, exceptId) {
    const p = S.staff[staffId]; const c = cfg(); const n = nowL();
    if (!p || !svc) return [];
    if (date < n.date || date > addDays(n.date, Number(c.maxDays))) return [];
    const wins = ((p.schedule || {})[dow(date)] || []);
    const busy = busyOf(staffId, date, exceptId); const out = [];
    const bb = Number(svc.bufferBefore) || 0, ba = Number(svc.bufferAfter) || 0, d = Number(svc.duration);
    for (const [ws, we] of wins) {
      for (let t = Math.ceil(ws / c.slotStep) * c.slotStep; t + d <= we; t += Number(c.slotStep)) {
        if (epoch(date, t) < n.ts + Number(c.minNotice) * 60000) continue;
        const s0 = t - bb, e0 = t + d + ba;
        if (busy.some(([s, e]) => s < e0 && s0 < e)) continue;
        out.push(t);
      }
    }
    return out;
  }
  function slotsAny(svc, date, exceptId) {
    const map = {};
    staffFor(svc.id).forEach((p) => slotsFor(svc, p.id, date, exceptId).forEach((t) => { (map[t] = map[t] || []).push(p.id); }));
    return map;
  }
  // "Cualquier profesional": se asigna a quien tenga menos citas ese día (reparto equitativo).
  const pickStaff = (ids, date) => ids.slice().sort((a, b) => vals(S.bookings).filter((x) => x.staffId === a && x.date === date && x.status !== 'cancelada').length - vals(S.bookings).filter((x) => x.staffId === b && x.date === date && x.status !== 'cancelada').length)[0];

  const normDni = (s) => String(s || '').replace(/[^0-9A-Za-z]/g, '').toUpperCase();
  function checkClient(client) {
    const name = String(client.name || '').trim(); const phone = normPhone(client.phone); const dni = normDni(client.dni);
    if (name.length < 2) throw new Error('Escribe tu nombre.');
    if (!/^9\d{8}$/.test(phone)) throw new Error('El celular debe tener 9 dígitos y empezar con 9.');
    if (!/^(\d{8}|[A-Z0-9]{9,12})$/.test(dni)) throw new Error('Escribe tu DNI (8 dígitos) o carné de extranjería.');
    if (client.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(client.email)) throw new Error('El correo no es válido.');
    return { name, phone, dni, email: String(client.email || '').trim(), note: String(client.note || '').trim().slice(0, 300) };
  }
  // En línea la reserva la valida y guarda la base (función book): elige profesional y bloquea cruces de forma atómica.
  async function createBooking(o) {
    const svc = S.services[o.svcId]; if (!svc) throw new Error('Elige un servicio.');
    if (backend !== 'supabase' || o.exceptId) return createBookingLocal(o);
    const cl = checkClient(o.client);
    const r = await rpc('book', { p_service: svc.id, p_staff: o.anyStaff ? null : o.staffId, p_date: o.date, p_start: o.start, p_name: cl.name, p_phone: cl.phone, p_email: cl.email || null, p_note: cl.note || null, p_dni: cl.dni });
    const b = { id: r.id, code: r.code, serviceId: svc.id, serviceName: r.serviceName, staffId: r.staffId, staffName: r.staffName, date: r.date, start: r.start, end: r.end, price: Number(r.price), client: cl, status: 'confirmada' };
    UI.lastB = b; loadAll().catch(() => {});
    return b;
  }
  // Reprogramar: en línea mueve la misma cita (código + celular); la base rechaza cruces.
  async function moveBooking(b, date, start, source, phone) {
    if (backend !== 'supabase') return createBookingLocal({ svcId: b.serviceId, staffId: b.staffId, date, start, client: b.client, source, exceptId: b.id });
    const r = await rpc('reschedule_booking', { p_code: b.code, p_phone: phone || b.client.phone, p_date: date, p_start: start });
    await loadAll().catch(() => {});
    return r;
  }
  async function createBookingLocal({ svcId, staffId, anyStaff, date, start, client, source, exceptId }) {
    const svc = S.services[svcId]; if (!svc) throw new Error('Elige un servicio.');
    const { name, phone, dni } = checkClient(client);
    const lockKey = (anyStaff ? 'any' : staffId) + '_' + date;
    return withLock(lockKey, async () => {
      let sid = staffId;
      if (anyStaff) { const m = slotsAny(svc, date, exceptId); if (!m[start]) throw new Error('Ese horario ya no está disponible. Elige otro.'); sid = pickStaff(m[start], date); }
      else if (!slotsFor(svc, sid, date, exceptId).includes(start)) throw new Error('Ese horario ya no está disponible. Elige otro.');
      const at = new Date().toISOString();
      const b = { id: uid('b'), code: code(), serviceId: svc.id, serviceName: svc.name, staffId: sid, staffName: (S.staff[sid] || {}).name || '', date, start, end: start + Number(svc.duration),
        blockStart: start - (Number(svc.bufferBefore) || 0), blockEnd: start + Number(svc.duration) + (Number(svc.bufferAfter) || 0), price: Number(svc.price) || 0,
        client: { name, phone, dni, email: String(client.email || '').trim(), note: String(client.note || '').trim().slice(0, 300) }, status: 'confirmada', source: source || 'publico', createdAt: at,
        history: [{ at, what: exceptId ? 'Reprogramada' : 'Reservada', by: source === 'panel' ? 'Salón' : 'Clienta' }] };
      if (exceptId) { const old = S.bookings[exceptId]; await put('bookings', Object.assign({}, old, { status: 'cancelada', cancelReason: 'Reprogramada a ' + date + ' ' + hm(start), history: (old.history || []).concat({ at, what: 'Reprogramada', by: source === 'panel' ? 'Salón' : 'Clienta' }) })); b.rescheduledFrom = old.code; b.code = old.code; }
      UI.lastB = b; if (backend !== 'supabase') { const old = S.clients[dni] || {}; await put('clients', Object.assign({}, old, { id: dni, name, phone, email: b.client.email || old.email || '', firstSeen: old.firstSeen || at, lastSeen: at })); } return put('bookings', b);
    });
  }

  // ───────── interfaz ─────────
  const UI = { view: '', bk: { svc: '', staff: 'any', month: '', date: '', start: null, step: 1 }, done: null, adminDate: '', filter: 'proximas' };
  const toast = (m, bad) => { let t = $('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); } const d = document.createElement('div'); if (bad) d.className = 'bad'; d.textContent = m; t.appendChild(d); setTimeout(() => d.remove(), bad ? 6000 : 3200); };
  let modalEl = null; let modalRefresh = null;
  function modal(title, body, foot, mount, refresh) {
    closeModal(); const bg = document.createElement('div'); bg.className = 'modal-bg';
    bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-h"><h2>${esc(title)}</h2><button class="btn ghost sm" data-x aria-label="Cerrar">✕</button></div><div class="modal-b">${body}</div>${foot ? `<div class="modal-f">${foot}</div>` : ''}</div>`;
    bg.addEventListener('mousedown', (e) => { if (e.target === bg) closeModal(); }); $('[data-x]', bg).onclick = closeModal;

  }

  const opt = (v, l, s) => `<option value="${esc(v)}"${String(v) === String(s) ? ' selected' : ''}>${esc(l)}</option>`;
  const statusPill = (s) => ({ confirmada: '<span class="pill lac">Confirmada</span>', completada: '<span class="pill ok">Atendida</span>', cancelada: '<span class="pill bad">Cancelada</span>', ausente: '<span class="pill warn">No asistió</span>' }[s] || esc(s));
  const demo = (x) => (x && x.demo ? ' <span class="tag-demo">DEMO</span>' : '');
  const ADMIN = [['citas', 'Citas'], ['agenda', 'Agenda'], ['clientas', 'Clientas'], ['servicios', 'Servicios'], ['equipo', 'Equipo y horarios'], ['ajustes', 'Ajustes']];

  const LOGO = (id) => `<svg viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6c9d9"/><stop offset=".55" stop-color="#dccff3"/><stop offset="1" stop-color="#bfe6d6"/></linearGradient></defs><circle cx="24" cy="24" r="23" fill="#fff" stroke="#eedfe6"/><path d="M24 7c-6.6 0-10.5 6.4-10.5 14.6V33c0 4.7 4.6 8 10.5 8s10.5-3.3 10.5-8V21.6C34.5 13.4 30.6 7 24 7z" fill="url(#${id})" stroke="#9b4f78" stroke-width="1.4"/><path d="M19 14.5c1.4-2.6 3.2-3.8 5-4" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" opacity=".9"/><path d="M37.5 9.5l.9 2.2 2.2.9-2.2.9-.9 2.2-.9-2.2-2.2-.9 2.2-.9z" fill="#9b4f78"/></svg>`;
  const brand = () => `<span class="na-logo"><img src="logo.jpg" alt="" width="38" height="38"><span class="na-word"><b>${esc(cfg().name || 'Nails Atelier')}</b><small>Nail salon · San Borja</small></span></span>`;
  function header() {
    const c = cfg(); const pub = PUB.includes(UI.view);
    if (pub) return `<header class="ptop"><div class="pin"><span class="pname">${brand('lg1')}</span>
      ${UI.view !== 'info' ? '<button class="plink" data-go="info">Info</button>' : ''}${UI.view === 'reservar' ? '<button class="plink" data-go="mi-cita">Mi cita</button>' : '<button class="plink" data-go="reservar">Reservar</button>'}${canEdit ? '<button class="plink" data-go="citas" title="Solo lo ves tú">Panel</button>' : ''}</div></header>`;
    return `<header class="top"><div class="in"><div class="logo">${brand('lg2')}</div>
      <nav class="tabs">${ADMIN.map(([k, l]) => `<button class="tab" data-go="${k}"${UI.view === k ? ' aria-current="page"' : ''}>${l}</button>`).join('')}<button class="tab" data-go="reservar">Ver página de reservas ↗</button>${backend === 'supabase' ? '<button class="tab" id="logout">Salir</button>' : ''}</nav></div></header>`;
  }
  const IG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1" fill="currentColor" stroke="none"/></svg>';
  const TT = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.6 3c.4 2.2 1.8 3.7 4 3.9v3.1c-1.5.1-2.9-.4-4-1.1v6.3c0 3.3-2.6 5.8-5.9 5.8S4.8 18.5 4.8 15.2s2.7-5.9 6-5.8c.3 0 .6 0 .9.1v3.2c-.3-.1-.6-.2-.9-.2-1.5 0-2.7 1.2-2.7 2.7s1.2 2.7 2.7 2.7 2.8-1.2 2.8-2.8V3h3z"/></svg>';
  function social(c) {
    const ig = c.instagram ? `<a href="https://www.instagram.com/${esc(c.instagram)}/" target="_blank" rel="noopener" aria-label="Seguir a ${esc(c.name)} en Instagram">${IG}Instagram</a>` : '';
    const tt = c.tiktok ? `<a href="https://www.tiktok.com/@${esc(c.tiktok)}" target="_blank" rel="noopener" aria-label="Seguir a ${esc(c.name)} en TikTok">${TT}TikTok</a>` : '';

  function footer() {

    return `<footer class="na-foot"><b>${esc(c.name)}</b>${c.address ? `<span><a href="${esc(map)}" target="_blank" rel="noopener">${esc(c.address)}</a>${c.landmark ? `<br>${esc(c.landmark)}` : ''}</span>` : ''}${c.hours ? `<span>${esc(c.hours)}</span>` : ''}
      <span>${c.phone ? `<a href="https://wa.me/51${esc(normPhone(c.phone))}" target="_blank" rel="noopener">WhatsApp ${esc(normPhone(c.phone).replace(/(\d{3})(\d{3})(\d{3})/, '$1 $2 $3'))}</a>` : ''}</span>${social(c)}</footer>`;
  }
  function render() {
    const a = $('#app'); const v = UI.view;
    const body = { reservar: viewBook, 'mi-cita': viewMine, info: viewInfo, ingresar: viewLogin, citas: viewCitas, agenda: viewAgenda, clientas: viewClients, servicios: viewServices, equipo: viewStaff, ajustes: viewSettings }[v]();
    const note = UI.loadError ? `<div class="banner warn">No se pudo cargar la agenda (${esc(UI.loadError)}). Revisa tu conexión y recarga la página.</div>`

    const demoNote = canEdit && !PUB.includes(v) && [S.services, S.staff, S.bookings].some((m) => vals(m).some((x) => x.demo)) ? '<div class="banner warn"><span class="tag-demo">DEMO</span> Hay datos de ejemplo (marcados DEMO). <button class="btn sm" id="clear-demo">Borrar ejemplo</button></div>' : '';
    a.innerHTML = header() + `<main class="wrap">${note}${demoNote}${body.html}${PUB.includes(v) && !(v === 'reservar' && UI.bk.step > 1 && !UI.done) ? footer() : ''}</main>`;
    const cd = $('#clear-demo'); if (cd) cd.onclick = () => guard(cd, async () => { for (const c of COLLS) for (const x of vals(S[c])) if (x.demo) await del(c, x.id); toast('Datos de ejemplo borrados'); });
    const lo = $('#logout'); if (lo) lo.onclick = () => guard(lo, async () => { await logout(); UI.want = ''; go('reservar'); toast('Sesión cerrada'); });
    if (body.after) body.after(a);
  }
  listeners.push(() => {
    const a = document.activeElement;
    if (modalEl && modalRefresh && !(modalEl.contains(a) && /INPUT|SELECT|TEXTAREA/.test(a.tagName))) modalRefresh();

    render();
  });

  // ───── página pública para celular: un paso por pantalla (servicio → con quién → día y hora → tus datos) ─────
  const STEPS = ['Servicio', 'Con quién', 'Día y hora', 'Tus datos'];
  function stepHead(n, title, sub) {
    return `<div class="w-head">${n > 1 ? '<button class="w-back" id="w-back" aria-label="Volver">‹</button>' : '<span></span>'}<div class="w-prog" aria-label="Paso ${n} de 4">${STEPS.map((s, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</div><span class="w-n">${n}/4</span></div>
      <h1 class="w-title">${esc(title)}</h1>${sub ? `<p class="w-sub">${sub}</p>` : ''}`;
  }
  const dayChip = (d, n) => { const x = new Date(d + 'T12:00:00Z'); return { dw: d === n ? 'Hoy' : d === addDays(n, 1) ? 'Mañana' : new Intl.DateTimeFormat('es-PE', { timeZone: 'UTC', weekday: 'short' }).format(x).replace('.', ''), dn: x.getUTCDate(), mo: new Intl.DateTimeFormat('es-PE', { timeZone: 'UTC', month: 'short' }).format(x).replace('.', '') }; };
  function viewBook() {
    const c = cfg(); const B = UI.bk; const n = nowL();
    if (UI.done) return viewDone();
    const svcs = services();
    if (!svcs.length) return { html: `<div class="mwrap"><div class="w-empty"><h1 class="w-title">Pronto podrás reservar aquí</h1><p class="w-sub">${canEdit ? 'Agrega tus servicios y tu equipo en el panel, o carga un ejemplo.' : 'El salón aún está preparando su agenda.'}</p>${canEdit ? '<button class="w-cta" id="seed">Cargar ejemplo</button>' : ''}</div></div>`, after: () => { const s = $('#seed'); if (s) s.onclick = () => guard(s, seed); } };
    if (!B.svc || !S.services[B.svc]) B.step = 1;
    const svc = S.services[B.svc]; const team = svc ? staffFor(svc.id) : [];
    if (B.step === 2 && team.length <= 1) B.step = 3;          // con una sola profesional no hace falta elegir
    if (B.step >= 3 && team.length === 1) B.staff = team[0].id;
    let html = '', bar = '', after = null;

    if (B.step === 1) {
      const cats = []; svcs.forEach((s) => { const k = s.category || 'Servicios'; if (!cats.includes(k)) cats.push(k); });
      const cat = cats.includes(B.cat) ? B.cat : '';
      html = `<div class="na-hero"><span class="na-tag">Reserva en línea</span><h1>Uñas <i>perfectas</i>, sin esperar</h1><p>${esc(c.tagline || 'Elige tu servicio y la hora que prefieras.')}</p><div class="na-info">${c.hours ? `<span>${esc(c.hours)}</span>` : ''}${c.address ? `<span>${esc(c.address)}</span>` : ''}</div></div>` + stepHead(1, '¿Qué te quieres hacer?', '') +
        (cats.length > 1 ? `<div class="w-chips" role="group" aria-label="Categorías"><button class="w-chip" data-cat="" aria-pressed="${!cat}">Todos</button>${cats.map((k) => `<button class="w-chip" data-cat="${esc(k)}" aria-pressed="${cat === k}">${esc(k)}</button>`).join('')}</div>` : '') +
        `<div class="w-list">${svcs.filter((s) => !cat || (s.category || 'Servicios') === cat).map((s) => `<button class="w-opt" data-svc="${s.id}"><span class="w-sw" style="background:${esc(s.color || 'var(--lacquer)')}"></span><span class="w-txt"><b>${esc(s.name)}</b>${demo(s)}${s.description ? `<small>${esc(s.description)}</small>` : ''}<small class="w-meta">${s.duration} min</small></span><span class="w-price">${money(s.price)}</span></button>`).join('')}</div>` + extrasBox(c) +
        `<p class="w-pol" style="text-align:center">Estacionamiento, pagos y políticas: <button class="w-link" data-go="info">ver información</button></p>`;
      after = (a) => {
        $$('[data-cat]', a).forEach((b) => (b.onclick = () => { B.cat = b.dataset.cat; render(); }));
        $$('[data-svc]', a).forEach((b) => (b.onclick = () => { B.svc = b.dataset.svc; B.staff = 'any'; B.date = ''; B.start = null; B.step = 2; render(); window.scrollTo(0, 0); }));
      };
    } else if (B.step === 2) {
      html = stepHead(2, '¿Con quién?', esc(svc.name) + ' · ' + svc.duration + ' min') +
        `<div class="w-list"><button class="w-opt" data-staff="any"><span class="w-ava any" aria-hidden="true">✦</span><span class="w-txt"><b>Cualquiera disponible</b><small>Más horarios para elegir</small></span><span class="w-go" aria-hidden="true">›</span></button>
        ${team.map((p) => `<button class="w-opt" data-staff="${p.id}"><span class="w-ava" aria-hidden="true">${esc(p.name.trim()[0] || '?')}</span><span class="w-txt"><b>${esc(p.name)}</b>${demo(p)}</span><span class="w-go" aria-hidden="true">›</span></button>`).join('')}</div>`;
      after = (a) => $$('[data-staff]', a).forEach((b) => (b.onclick = () => { B.staff = b.dataset.staff; B.date = ''; B.start = null; B.step = 3; render(); window.scrollTo(0, 0); }));
    } else if (B.step === 3) {
      const slotsOn = (d) => (B.staff === 'any' ? Object.keys(slotsAny(svc, d)).map(Number).sort((x, y) => x - y) : slotsFor(svc, B.staff, d));
      const span = Math.min(Number(c.maxDays), B.more ? 60 : 14);
      const days = []; for (let i = 0; i <= span; i++) { const d = addDays(n.date, i); days.push([d, slotsOn(d).length]); }
      if (!B.date || !days.some(([d, k]) => d === B.date && k)) { const f = days.find(([, k]) => k); B.date = f ? f[0] : ''; B.start = null; }
      const sl = B.date ? slotsOn(B.date) : [];
      const groups = [['Mañana', (t) => t < 720], ['Tarde', (t) => t >= 720 && t < 1080], ['Noche', (t) => t >= 1080]].map(([l, f]) => [l, sl.filter(f)]).filter(([, x]) => x.length);
      const who = B.staff === 'any' ? 'cualquier profesional' : (S.staff[B.staff] || {}).name;
      html = stepHead(3, 'Elige día y hora', esc(svc.name) + ' · con ' + esc(who)) +
        `<div class="w-days" id="w-days" role="group" aria-label="Días">${days.map(([d, k]) => { const x = dayChip(d, n.date); return `<button class="w-day" data-day="${d}" aria-pressed="${B.date === d}"${k ? '' : ' disabled'} aria-label="${esc(fmtD(d))}${k ? '' : ', sin horarios'}"><small>${esc(x.dw)}</small><b>${x.dn}</b><small>${esc(x.mo)}</small></button>`; }).join('')}${!B.more && Number(c.maxDays) > 14 ? '<button class="w-day more" id="w-more">Más<br>fechas</button>' : ''}</div>` +
        (B.date ? `<p class="w-date">${esc(fmtD(B.date))}</p>${groups.map(([l, x]) => `<h3 class="w-gl">${l}</h3><div class="w-times">${x.map((t) => `<button class="w-time" data-t="${t}" aria-pressed="${B.start === t}">${hm(t)}</button>`).join('')}</div>`).join('')}` : '<div class="w-empty"><p class="w-sub">No hay horarios libres en estas fechas.</p></div>');

      };
    } else {
      const who = B.staff === 'any' ? 'La primera profesional disponible' : (S.staff[B.staff] || {}).name;
      const F = B.form || {};
      html = stepHead(4, 'Tus datos', 'Nombre, DNI y celular para confirmar tu cita.') +
        `<div class="w-sum"><div><b>${esc(svc.name)}</b><span>${esc(fmtD(B.date))} · ${hm(B.start)} – ${hm(B.start + Number(svc.duration))}</span><span>${esc(who)}</span></div><b class="w-price">${money(svc.price)}</b></div>
        <form id="bk-form" class="w-form" novalidate>
          <label class="w-f" for="cl-n"><span>Nombre</span><input type="text" id="cl-n" autocomplete="name" autocapitalize="words" enterkeyhint="next" value="${esc(F.name || '')}" required></label>
          <label class="w-f" for="cl-d"><span>DNI</span><input type="text" id="cl-d" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="8 dígitos (o carné de extranjería)" enterkeyhint="next" value="${esc(F.dni || '')}" required></label>
          <label class="w-f" for="cl-p"><span>Celular</span><input type="tel" id="cl-p" autocomplete="tel-national" inputmode="numeric" placeholder="9XX XXX XXX" enterkeyhint="done" value="${esc(F.phone || '')}" required></label>
          <details class="w-more"${F.note || F.email ? ' open' : ''}><summary>Agregar nota o correo (opcional)</summary>
            <label class="w-f" for="cl-x"><span>Nota (diseño, largo, alergias)</span><textarea id="cl-x" rows="2">${esc(F.note || '')}</textarea></label>
            <label class="w-f" for="cl-e"><span>Correo</span><input type="email" id="cl-e" autocomplete="email" value="${esc(F.email || '')}"></label></details>
          <p class="w-pol">${esc(c.policy)}${Number(c.depositPct) > 0 ? ` Adelanto: ${money(svc.price * c.depositPct / 100)} (${esc(c.payMethods)}).` : ''} Tolerancia máxima: 10 minutos. Pago: ${esc(c.payMethods)}. Al confirmar aceptas <button type="button" class="w-link" data-go="info">nuestras políticas</button>.</p>
          <p class="err" id="bk-err" role="alert"></p></form>`;
      bar = '<button class="w-cta" id="w-ok">Confirmar cita</button>';
      after = () => {
        const keep = () => { B.form = { name: $('#cl-n').value, dni: $('#cl-d').value, phone: $('#cl-p').value, note: $('#cl-x').value, email: $('#cl-e').value }; };
        $('#bk-form').addEventListener('input', keep);
        const submit = () => { keep(); const btn = $('#w-ok'); $('#bk-err').textContent = '';
          guard(btn, async () => { const b = await createBooking({ svcId: svc.id, staffId: B.staff, anyStaff: B.staff === 'any', date: B.date, start: B.start, client: B.form, source: 'publico' }); UI.done = b.id; UI.doneB = b; B.form = {}; render(); window.scrollTo(0, 0); })
            .catch((er) => { $('#bk-err').textContent = er.message; if (/horario/.test(er.message)) { B.start = null; setTimeout(() => { B.step = 3; render(); toast(er.message, true); }, 1200); } }); };
        $('#bk-form').addEventListener('submit', (e) => { e.preventDefault(); submit(); });
        $('#w-ok').onclick = submit;
      };
    }
    return { html: `<div class="mwrap">${html}</div>${bar ? `<div class="w-bar">${bar}</div>` : ''}`,
      after: (a) => { const bk = $('#w-back'); if (bk) bk.onclick = () => { B.step = B.step === 3 && team.length <= 1 ? 1 : B.step - 1; B.start = B.step < 4 ? B.start : B.start; render(); window.scrollTo(0, 0); }; if (after) after(a); } };
  }
  function viewDone() {
    const c = cfg(); const b = S.bookings[UI.done] || (UI.doneB && UI.doneB.id === UI.done ? UI.doneB : {}); const p = S.staff[b.staffId] || {};
    if (!b.id || !b.date) { UI.done = null; UI.bk = { svc: '', staff: 'any', date: '', start: null, step: 1 }; return viewBook(); }
    const gcal = 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(b.serviceName + ' · ' + c.name) + '&dates=' + gDates(b) + '&details=' + encodeURIComponent('Código ' + b.code + (c.address ? ' · ' + c.address : '')) + (c.address ? '&location=' + encodeURIComponent(c.address) : '');

    return { html: `<div class="mwrap"><div class="w-done"><div class="check" aria-hidden="true">✓</div><h1 class="w-title">¡Listo, te esperamos!</h1><p class="w-sub">Guarda tu código: lo necesitas para cambiar o cancelar.</p>
      <div class="w-code">${esc(b.code)}</div>

  // ───── panel: base de datos de clientas (una por DNI, con su historial) ─────
  function clientRows() {
    const m = {};

    vals(S.bookings).forEach((b) => { const d = b.client && b.client.dni; if (!d) return; const r = (m[d] = m[d] || { dni: d, name: b.client.name, phone: b.client.phone, email: b.client.email, notes: '', firstSeen: b.createdAt || '', list: [] }); r.list.push(b); });

  function exportClients(rows) {

      <label class="f" for="c-tg" style="margin-top:10px"><span>Frase de portada</span><input type="text" id="c-tg" value="${esc(c.tagline || '')}"></label><label class="f" for="c-po" style="margin-top:10px"><span>Política de cambios (resumen al reservar)</span><textarea id="c-po">${esc(c.policy)}</textarea></label>
      <label class="f" for="c-cut" style="margin-top:10px"><span>La clienta puede cambiar o cancelar sola hasta</span><select id="c-cut">${[['', '3 horas antes de la cita'], [1080, 'El día anterior, 6:00 p. m.'], [1200, 'El día anterior, 8:00 p. m.'], [1320, 'El día anterior, 10:00 p. m.']].map(([v, l]) => opt(v, l, c.cutoffPrevDayMin == null ? '' : c.cutoffPrevDayMin)).join('')}</select></label>
      <h3 style="margin-top:16px">Información para clientas (página Info)</h3><p class="small muted">Un punto por línea.</p>
      <label class="f" for="c-ab"><span>Quiénes somos</span><textarea id="c-ab" rows="3">${esc(c.about || '')}</textarea></label>
      <label class="f" for="c-lm"><span>Referencia de ubicación</span><input type="text" id="c-lm" value="${esc(c.landmark || '')}"></label>
      <label class="f" for="c-pk"><span>Estacionamiento</span><textarea id="c-pk" rows="3">${esc(arr(c.parking).join('\n'))}</textarea></label>
      <label class="f" for="c-pi"><span>Pago</span><textarea id="c-pi" rows="2">${esc(arr(c.payInfo).join('\n'))}</textarea></label>
      <label class="f" for="c-pl"><span>Nuestras políticas</span><textarea id="c-pl" rows="6">${esc(arr(c.policies).join('\n'))}</textarea></label>
      <label class="f" for="c-ex"><span>Adicionales (nombre | precio)</span><textarea id="c-ex" rows="3">${esc(arr(c.extras).join('\n'))}</textarea></label><div class="row" style="margin-top:10px"><span class="err grow" id="c-e"></span><button class="btn primary" id="c-ok">Guardar ajustes</button></div></div>
      <div class="card small"><b>Dónde se guardan los datos:</b> ${backend === 'supabase' ? 'en tu base de datos de Supabase. Solo las cuentas del salón ven nombres y celulares; la página pública solo sabe qué horarios están ocupados.' : 'solo en este navegador (modo de prueba, falta config.js).'}</div>`,
      after: () => { const b = $('#c-ok'); b.onclick = () => guard(b, async () => { const name = $('#c-n').value.trim(); if (!name) throw new Error('Escribe el nombre del salón.');
        await put('config', Object.assign({}, cfg(), { name, address: $('#c-a').value.trim(), hours: $('#c-h').value.trim(), tiktok: $('#c-tk').value.trim().replace(/^@/, ''), instagram: $('#c-ig').value.trim().replace(/^@/, ''), tagline: $('#c-tg').value.trim(), phone: normPhone($('#c-p').value), slotStep: Number($('#c-st').value), minNotice: Number($('#c-mn').value), maxDays: Math.max(1, Number($('#c-md').value) || 30), depositPct: Math.min(100, Math.max(0, Number($('#c-dp').value) || 0)), payMethods: $('#c-pm').value.trim(), policy: $('#c-po').value.trim(), cutoffPrevDayMin: $('#c-cut').value === '' ? null : Number($('#c-cut').value), about: $('#c-ab').value.trim(), landmark: $('#c-lm').value.trim(), parking: arr($('#c-pk').value), payInfo: arr($('#c-pi').value), policies: arr($('#c-pl').value), extras: arr($('#c-ex').value) })); toast('Ajustes guardados'); }).catch((e) => ($('#c-e').textContent = e.message)); } };
  }

  // ───── datos de ejemplo (botón, marcados DEMO) ─────
  async function seed() {
    const svcs = [
      ['Base Rubber', 'Sistemas', 90, 85, '#e4ded6', 'Base flexible que ayuda al crecimiento de la uña natural. Limpieza + base rubber + esmaltado + hidratación BYREDO.'], ['Builder Gel', 'Sistemas', 120, 100, '#d6d1ca', 'Gel constructor para mayor firmeza y duración. Limpieza + builder gel + esmaltado + hidratación BYREDO.'],
      ['Softgel', 'Sistemas', 150, 120, '#cbc6bf', 'Extensiones con tips preformados: uñas largas y acabado natural.'], ['Manicare', 'Manicure', 60, 55, '#ece8e2', 'Limpieza + exfoliación + restaurador clinical + hidratación profunda BYREDO.'],
      ['Pedicure clásica', 'Pedicure', 60, 55, '#e8e6e2', 'Limpieza básica + esmaltado gel frío + exfoliación + hidratación BYREDO.'], ['Pedicure gel color', 'Pedicure', 75, 65, '#dedad4', 'Limpieza básica + esmaltado color gel + exfoliación + hidratación BYREDO.'],
    ];
    const ids = [];
    for (let i = 0; i < svcs.length; i++) { const [name, category, duration, price, color, description] = svcs[i]; const id = 's_demo' + i; ids.push(id); await put('services', { id, name, category, duration, price, color, description, bufferBefore: 0, bufferAfter: 10, active: true, order: i, demo: true }); }
    const week = { 1: [[600, 1200]], 2: [[600, 1200]], 3: [[600, 1200]], 4: [[600, 1200]], 5: [[600, 1200]], 6: [[600, 1020]] };
    await put('staff', { id: 'p_demo1', name: 'Alice', services: ids, schedule: week, active: true, demo: true });
    await put('staff', { id: 'p_demo2', name: 'Pía', services: ids, schedule: week, active: true, demo: true });
    toast('Ejemplo cargado: 6 servicios, Alice y Pía (DEMO)');
  }

  init().then(() => { const h = location.hash.slice(1); go(h || (canEdit ? 'citas' : 'reservar')); });
  window.__agenda = { S, slotsFor, slotsAny, createBooking, moveBooking, put, nowL, seed, get backend() { return backend; } };
})();
</script>
